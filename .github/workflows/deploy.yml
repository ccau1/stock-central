# =============================================================================
# CONFIG
# =============================================================================
# Branch:     main
# Staging:    stocks.staging.tribalorigin.com
# Prod:       stocks.tribalorigin.com
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/web/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Production deployment target'
        required: true
        default: 'shared'
        type: choice
        options:
          - shared
          - standalone

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

  # App-specific deployment config. Edit these values when reusing this workflow
  # in another repository.
  STAGING_DOMAIN: stocks.staging.tribalorigin.com
  STAGING_REMOTE_PATH: /opt/stock-central-staging
  STAGING_COMPOSE_FILE: docker-compose.staging.yml
  STAGING_HEALTH_URL: https://stocks.staging.tribalorigin.com/health

  PROD_DOMAIN: stocks.tribalorigin.com
  PROD_REMOTE_PATH: /opt/stock-central-prod
  PROD_COMPOSE_FILE: docker-compose.prod.yml
  PROD_HEALTH_URL: https://stocks.tribalorigin.com/health

  STANDALONE_REMOTE_PATH: /opt/stock-central-prod-standalone
  STANDALONE_COMPOSE_FILE: docker-compose.prod-standalone.yml

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build & push server
        uses: ./.github/actions/build-and-push-image
        with:
          image-name: server
          context: ./packages/server
          tags: |
            staging
            staging-${{ github.sha }}

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build & push web
        uses: ./.github/actions/build-and-push-image
        with:
          image-name: web
          context: .
          file: ./packages/web/Dockerfile.prod
          tags: |
            staging
            staging-${{ github.sha }}

  deploy-staging:
    needs: [build-server, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        uses: ./.github/actions/deploy-to-hetzner
        with:
          host: ${{ secrets.STAGING_HETZNER_HOST }}
          username: ${{ secrets.STAGING_HETZNER_USER }}
          ssh-key: ${{ secrets.STAGING_HETZNER_SSH_KEY }}
          remote-path: ${{ env.STAGING_REMOTE_PATH }}
          compose-file: ${{ env.STAGING_COMPOSE_FILE }}
          files-to-copy: |
            deploy/${{ env.STAGING_COMPOSE_FILE }}
            deploy/.env
            deploy/nginx.dev.conf
          env-file-content: ${{ secrets.STAGING_ENV_FILE }}
          env-file-header: |
            DOMAIN_STAGING=${{ env.STAGING_DOMAIN }}
            TRAEFIK_NETWORK=staging
          protected-env-keys: SERVER_IMAGE,WEB_IMAGE,DOMAIN_STAGING,DOMAIN_PROD,TRAEFIK_NETWORK
          runtime-env-vars: |
            export SERVER_IMAGE="${{ env.IMAGE_BASE }}/server:staging-${{ github.sha }}"
            export WEB_IMAGE="${{ env.IMAGE_BASE }}/web:staging-${{ github.sha }}"
          ghcr-token: ${{ secrets.GH_TOKEN }}
          post-deploy-script: |
            echo "Container status:"
            docker compose -f ${{ env.STAGING_COMPOSE_FILE }} ps
            docker compose -f ${{ env.STAGING_COMPOSE_FILE }} logs --tail 30
          health-check-url: ${{ env.STAGING_HEALTH_URL }}
          health-check-max-attempts: 24
          health-check-interval-seconds: 5

  promote-to-prod:
    name: Promote to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── Shared production server (default) ────────────────────────

      - name: Deploy to shared prod
        if: ${{ github.event.inputs.deployment_target != 'standalone' }}
        uses: ./.github/actions/deploy-to-hetzner
        with:
          host: ${{ secrets.PROD_HETZNER_HOST }}
          username: ${{ secrets.PROD_HETZNER_USER }}
          ssh-key: ${{ secrets.PROD_HETZNER_SSH_KEY }}
          remote-path: ${{ env.PROD_REMOTE_PATH }}
          compose-file: ${{ env.PROD_COMPOSE_FILE }}
          files-to-copy: |
            deploy/${{ env.PROD_COMPOSE_FILE }}
            deploy/.env
            deploy/nginx.dev.conf
          env-file-content: ${{ secrets.PROD_ENV_FILE }}
          env-file-header: |
            DOMAIN_PROD=${{ env.PROD_DOMAIN }}
            TRAEFIK_NETWORK=prod
          protected-env-keys: SERVER_IMAGE,WEB_IMAGE,DOMAIN_STAGING,DOMAIN_PROD,TRAEFIK_NETWORK
          runtime-env-vars: |
            export SERVER_IMAGE="${{ env.IMAGE_BASE }}/server:staging-${{ github.sha }}"
            export WEB_IMAGE="${{ env.IMAGE_BASE }}/web:staging-${{ github.sha }}"
          ghcr-token: ${{ secrets.GH_TOKEN }}
          health-check-url: ${{ env.PROD_HEALTH_URL }}
          health-check-max-attempts: 24
          health-check-interval-seconds: 5

      # ── Standalone production server (future/legacy) ──────────────

      - name: Deploy to standalone prod
        if: ${{ github.event.inputs.deployment_target == 'standalone' }}
        uses: ./.github/actions/deploy-to-hetzner
        with:
          host: ${{ secrets.PROD_STANDALONE_HETZNER_HOST }}
          username: ${{ secrets.PROD_STANDALONE_HETZNER_USER }}
          ssh-key: ${{ secrets.PROD_STANDALONE_HETZNER_SSH_KEY }}
          remote-path: ${{ env.STANDALONE_REMOTE_PATH }}
          compose-file: ${{ env.STANDALONE_COMPOSE_FILE }}
          files-to-copy: |
            deploy/${{ env.STANDALONE_COMPOSE_FILE }}
            deploy/.env
            deploy/nginx.prod-standalone.conf
          env-file-content: ${{ secrets.PROD_STANDALONE_ENV_FILE }}
          protected-env-keys: SERVER_IMAGE,WEB_IMAGE
          runtime-env-vars: |
            export SERVER_IMAGE="${{ env.IMAGE_BASE }}/server:staging-${{ github.sha }}"
            export WEB_IMAGE="${{ env.IMAGE_BASE }}/web:staging-${{ github.sha }}"
          ghcr-token: ${{ secrets.GH_TOKEN }}
          ssh-env-vars: |
            CF_ORIGIN_CERT=${{ secrets.CF_ORIGIN_CERT }}
            CF_ORIGIN_KEY=${{ secrets.CF_ORIGIN_KEY }}
          pre-deploy-script: |
            if [ -n "$CF_ORIGIN_CERT" ]; then
              mkdir -p ${{ env.STANDALONE_REMOTE_PATH }}/ssl
              printf '%s\n' "$CF_ORIGIN_CERT" > ${{ env.STANDALONE_REMOTE_PATH }}/ssl/cloudflare-origin.pem
              printf '%s\n' "$CF_ORIGIN_KEY" > ${{ env.STANDALONE_REMOTE_PATH }}/ssl/cloudflare-origin.key
              chmod 600 ${{ env.STANDALONE_REMOTE_PATH }}/ssl/cloudflare-origin.key
              chmod 644 ${{ env.STANDALONE_REMOTE_PATH }}/ssl/cloudflare-origin.pem
            fi
          health-check-url: https://${{ secrets.PROD_STANDALONE_HETZNER_HOST }}/health
          health-check-insecure: true
          health-check-max-attempts: 24
          health-check-interval-seconds: 5
