version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  server:
    image: ${SERVER_IMAGE}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN}
      TZ: America/New_York
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod-standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
